  <rect x="416" y="556" width="280" height="86" rx="12" fill="#f0f1ef" stroke="#cdd3ce" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="556" y="584" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#7c8a82">intermediate steps｜子代理内部</text>
  <text x="556" y="604" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa39d">读文件 · 试错 · 大段原文</text>
  <text x="556" y="624" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa39d">不进主上下文，只回结论 + file:line</text>

  <!-- 脚注 -->
  <text x="54" y="682" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">经验不写日记：日记过 14 天不进检索，经验越老越该在。派活门槛：要扫 3 个以上文件才起子代理。</text>

