<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-label="分层记忆：记忆层负责记和查，编排层负责查经验、派子代理、落经验，子代理的中间过程不进主上下文；检索打分那一步可选挂同义扩展插件">
  <title>分层记忆 · 两层数据流</title>
  <desc>上半是记忆层：对话 → 召回 → 注入 prompt；日记 → 固化 → 长期库（事实库、主题、索引、经验）→ 检索打分，结果回到召回；作废给旧条目挂标记。检索打分下方挂着一个虚线框的可选插件「同义扩展」：只扩大命中集合、不改查询文本，命中按 0.7 折，关掉即回原字面逻辑。下半是编排层：主循环 loop.py → ① 查经验（memory/经验.py lookup）→ ② 派子代理（隔离环境，delegate(task)）→ ③ 落经验（写回 长期/经验.md）。子代理往下那条虚线被截断，标注 intermediate steps 不进主上下文，回来的只有结论和 file:line。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c8a82"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f6f57"/>
    </marker>
    <marker id="arrow-cut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b0b8b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="860" fill="#fbfbfa"/>

  <!-- ================= 标题 ================= -->
  <text x="48" y="50" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#2b2f2d">分层记忆：两层——一个记忆库，一个主循环</text>
  <text x="48" y="72" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a938d">纯文件 · 不要数据库 · 记忆层管记和查，编排层管把活儿派出去、只把结论收回来</text>
  <line x1="48" y1="86" x2="952" y2="86" stroke="#e5e8e5" stroke-width="1"/>

  <!-- ================= 第一层：记忆层 ================= -->
  <rect x="36" y="96" width="928" height="348" rx="16" fill="#f3f6f4"/>
  <text x="54" y="118" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#2f6f57">第一层 · 记忆层：记和查</text>
  <text x="946" y="118" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">一条记忆怎么进、怎么出</text>

  <!-- 使用链路 -->
  <rect x="54" y="136" width="150" height="78" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="129" y="170" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">对话</text>
  <text x="129" y="190" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">用户这一句</text>

  <rect x="252" y="136" width="188" height="78" rx="12" fill="#ffffff" stroke="#2f6f57" stroke-width="1.8"/>
  <text x="346" y="170" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2f6f57">召回 search</text>
  <text x="346" y="190" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">打分 · 取前 3 条</text>

  <rect x="488" y="136" width="212" height="78" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="594" y="170" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">注入 prompt</text>
  <text x="594" y="190" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">「你记得的一些事，只作参考」</text>

  <line x1="204" y1="175" x2="246" y2="175" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="164" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">这句话</text>
  <line x1="440" y1="175" x2="482" y2="175" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="461" y="164" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">前 3 条</text>

  <!-- 沉淀链路 -->
  <rect x="54" y="254" width="128" height="78" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="118" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">日记</text>
  <text x="118" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">一节一条</text>

  <rect x="226" y="254" width="112" height="78" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="282" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">固化</text>
  <text x="282" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">去重 · 列候选</text>

  <rect x="384" y="254" width="190" height="78" rx="12" fill="#ffffff" stroke="#2f6f57" stroke-width="1.8"/>
  <text x="479" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2f6f57">长期库</text>
  <text x="479" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">事实库 · 主题 · 索引 · 经验</text>

  <rect x="620" y="254" width="132" height="78" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="686" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">检索打分</text>
  <text x="686" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">跳过作废 · 降序</text>

  <line x1="182" y1="293" x2="220" y2="293" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="201" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">最近 7 天</text>
  <line x1="338" y1="293" x2="378" y2="293" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="358" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">不重复的</text>
  <line x1="574" y1="293" x2="614" y2="293" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="594" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">按关键词</text>

  <!-- 检索 → 召回 -->
  <path d="M 686 254 L 686 224 L 346 224 L 346 219" fill="none" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="516" y="240" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">打分结果</text>

  <!-- 作废：从侧边插入 -->
  <rect x="796" y="254" width="150" height="78" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="871" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2b2f2d">作废 deprecate</text>
  <text x="871" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">只加标记，不改正文</text>
  <line x1="752" y1="293" x2="790" y2="293" stroke="#2f6f57" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>

  <!-- 可选插件：同义扩展（虚线圆角框 = 可选，不占核心路径） -->
  <rect x="566" y="352" width="240" height="78" rx="12" fill="#ffffff" stroke="#7c8a82" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="586" y="375" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#3f4a44">插件 · 同义扩展</text>
  <text x="586" y="392" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8a938d">plugins/同义扩展.json</text>
  <text x="586" y="409" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">扩匹配集合，不改查询文本</text>
  <text x="586" y="424" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#4b5550">命中折 0.7</text>

  <line x1="686" y1="352" x2="686" y2="334" stroke="#7c8a82" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <text x="698" y="347" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#8a938d">可选</text>

  <text x="74" y="386" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">可选：插件只告诉检索「这些词也算命中」，查询本身一个字不改；</text>
  <text x="74" y="406" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">命中按 weight 折（缺省 0.7），分母仍是原查询长度；关掉即回字面逻辑。</text>

  <!-- ================= 第二层：编排层 ================= -->
  <rect x="36" y="456" width="928" height="300" rx="16" fill="#f7f5f1"/>
  <text x="54" y="482" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#2f6f57">第二层 · 编排层：怎么用</text>
  <text x="946" y="482" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">只把结论收回来</text>

  <rect x="54" y="500" width="158" height="86" rx="12" fill="#ffffff" stroke="#2f6f57" stroke-width="1.8"/>
  <text x="133" y="532" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2f6f57">主循环 loop.py</text>
  <text x="133" y="554" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">三步，不多加</text>
  <text x="133" y="572" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">判断 + 验收</text>

  <rect x="246" y="500" width="178" height="86" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="335" y="532" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">① 查经验</text>
  <text x="335" y="554" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">经验.py lookup</text>
  <text x="335" y="572" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">撞上「败」先看死因</text>

  <rect x="458" y="500" width="196" height="86" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="556" y="532" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">② 派子代理</text>
  <text x="556" y="554" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">delegate(task) · 隔离环境</text>
  <text x="556" y="572" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">回一条 dict</text>

  <rect x="688" y="500" width="200" height="86" rx="12" fill="#ffffff" stroke="#c9cfcb" stroke-width="1.5"/>
  <text x="788" y="532" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2b2f2d">③ 落经验</text>
  <text x="788" y="554" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">写回 长期/经验.md</text>
  <text x="788" y="572" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">成 / 败 / 半 + 死因</text>

  <line x1="212" y1="543" x2="240" y2="543" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="492" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#8a938d">活儿</text>
  <line x1="424" y1="543" x2="452" y2="543" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="438" y="492" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#8a938d">先查</text>
  <line x1="654" y1="543" x2="682" y2="543" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="668" y="492" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#8a938d">结论</text>

  <!-- 编排层读写长期库 -->
  <path d="M 479 332 L 479 472 L 335 472 L 335 492" fill="none" stroke="#2f6f57" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <path d="M 479 332 L 479 472 L 788 472 L 788 492" fill="none" stroke="#2f6f57" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <text x="398" y="464" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#2f6f57">读经验</text>
  <text x="726" y="464" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#2f6f57">写经验</text>

  <text x="74" y="624" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">主脑在这儿只做三件事：</text>
  <text x="74" y="646" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">查过没有 · 派给谁 · 验收结论</text>

  <!-- 子代理：被截断的中间过程 -->
  <line x1="556" y1="586" x2="556" y2="614" stroke="#b0b8b2" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="556" y1="630" x2="556" y2="652" stroke="#cdd3ce" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="568" y="627" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#9aa39d">✂</text>
  <text x="588" y="627" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa39d">截断</text>

  <rect x="416" y="656" width="280" height="86" rx="12" fill="#f0f1ef" stroke="#cdd3ce" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="556" y="684" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#7c8a82">intermediate steps｜子代理内部</text>
  <text x="556" y="704" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa39d">读文件 · 试错 · 大段原文</text>
  <text x="556" y="724" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa39d">不进主上下文，只回结论 + file:line</text>

  <!-- 脚注 -->
  <text x="54" y="782" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">经验不写日记：日记过 14 天不进检索，经验越老越该在。派活门槛：要扫 3 个以上文件才起子代理。</text>

  <!-- 图例 -->
  <line x1="54" y1="814" x2="100" y2="814" stroke="#7c8a82" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="818" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">读写数据流</text>
  <line x1="216" y1="814" x2="262" y2="814" stroke="#2f6f57" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <text x="272" y="818" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">作废 / 编排层读写经验</text>
  <line x1="446" y1="814" x2="492" y2="814" stroke="#b0b8b2" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="502" y="818" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa39d">被截断的中间过程</text>
  <rect x="616" y="807" width="26" height="14" rx="4" fill="none" stroke="#7c8a82" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="652" y="818" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8a938d">虚线圆角框 = 可选插件</text>
